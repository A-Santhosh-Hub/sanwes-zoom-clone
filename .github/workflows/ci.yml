name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packages (server and web client)
        run: |
          npm ci
          npm ci --prefix client
      - name: Every JavaScript file parses
        run: npm run check
      - name: Build the web client
        run: npm run build
