<!doctype html><html><head><meta charset="utf-8"><title>Choose what to share</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: #1d1f23; color: #f2f3f5; display: flex; flex-direction: column; height: 100vh; }
  h1 { font-size: 16px; margin: 16px 18px 6px; } p { margin: 0 18px 10px; color: #9aa0a8; font-size: 13px; }
  #grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; padding: 4px 18px 12px; align-content: start; }
  .it { background: #26282c; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .it:hover { background: #2f3238; } .it[aria-pressed="true"] { border-color: #0e72ed; }
  .it img { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #111; border-radius: 6px; display: block; }
  .it span { display: block; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  footer { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #34373c; }
  footer label { flex: 1; } button.go { background: #0e72ed; color: #fff; border: 0; border-radius: 8px; padding: 9px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button.go:disabled { opacity: .4; cursor: default; } button.no { background: transparent; color: #cfd3d8; border: 1px solid #4a4e54; border-radius: 8px; padding: 9px 18px; font: inherit; cursor: pointer; }
</style></head><body>
<h1>Choose what to share</h1><p>Screens and windows. Your guests will see what you pick.</p>
<div id="grid"></div>
<footer><label><input type="checkbox" id="sound"> Share computer sound</label><button class="no" id="cancel">Cancel</button><button class="go" id="go" disabled>Share</button></footer>
<script>
  let chosen = null;
  studio.picker.items().then((items) => {
    const grid = document.getElementById('grid');
    for (const it of items.sort((a, b) => Number(b.screen) - Number(a.screen))) {
      const b = document.createElement('button'); b.className = 'it'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      const img = document.createElement('img'); img.src = it.thumb; const s = document.createElement('span'); s.textContent = it.screen ? `Screen: ${it.name}` : it.name;
      b.append(img, s);
      b.onclick = () => { chosen = it.id; for (const x of grid.children) x.setAttribute('aria-pressed', String(x === b)); document.getElementById('go').disabled = false; };
      b.ondblclick = () => document.getElementById('go').click();
      grid.append(b);
    }
  });
  document.getElementById('go').onclick = () => studio.picker.choose({ id: chosen, sound: document.getElementById('sound').checked });
  document.getElementById('cancel').onclick = () => studio.picker.choose(null);
</script></body></html>
