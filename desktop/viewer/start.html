<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SanWe's Viewer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14171a; color: #e8ebee; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(520px, calc(100% - 40px)); }
  h1 { font-size: 24px; margin: 0 0 4px; } p { color: #9aa4ad; margin: 4px 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid #3a4148; background: #1d2126; color: inherit; font: inherit; }
  button { margin-top: 12px; padding: 11px 22px; border: 0; border-radius: 8px; background: #0e72ed; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: #ff8a80; min-height: 1.4em; margin-top: 8px; } .note { font-size: 13px; margin-top: 24px; }
</style></head>
<body><main>
  <h1>SanWe's Viewer</h1>
  <p>Paste the class link your teacher sent you.</p>
  <form id="f"><input id="link" placeholder="https://… or the class link" autocomplete="off" autofocus><button type="submit">Open class</button></form>
  <div id="err" class="err" role="alert"></div>
  <p class="note">This window is hidden from screenshots and screen recorders to protect the class. Anything you record will show black.</p>
</main>
<script>
  const link = document.getElementById('link'), err = document.getElementById('err');
  window.viewer.last().then((v) => { if (v) link.value = v; });
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    if (!(await window.viewer.open(link.value))) err.textContent = 'That does not look like a class link.';
  });
</script></body></html>
